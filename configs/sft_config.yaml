model_name: "unsloth/Qwen2.5-3B-Instruct-bnb-4bit"
fallback_model_name: "Qwen/Qwen2.5-3B-Instruct"
max_seq_length: 1024
load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  random_state: 3407

training:
  output_dir: "checkpoints/sft-qwen2.5-3b"
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "adamw_8bit"
  logging_steps: 10
  save_strategy: "epoch"
  seed: 3407
  train_on_responses_only: true

data:
  train_file: "data/sft_train.jsonl"
  holdout_file: "data/test_holdout.jsonl"
  val_split_ratio: 0.05
